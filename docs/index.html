<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Morse Tap</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morse Tap">
<meta name="description" content="Send morse code to another person, in real time.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0B0E14; --surface:#141922; --high:#1D2430; --border:#2A3340;
  --text:#E6EDF3; --dim:#8B98A9; --accent:#FFB454; --accentdim:#4A3A22;
  --good:#4ED88A; --bad:#FF6B6B; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
html,body{margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  /* Fixed to the viewport so the page itself can never scroll and slide
     the header under the status bar. Only #log and #otherview scroll. */
  position:fixed; inset:0;
  height:100dvh; max-height:100dvh;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none; -webkit-user-select:none;
}
@supports not (height: 100dvh){ body{height:100%} }
button,input{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}

header{flex:none;padding:8px 16px 0}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:18px;font-weight:800;letter-spacing:3px;margin:0}
.chip{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;
  border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:700;
}
.chip::before{content:"";width:7px;height:7px;border-radius:4px;background:currentColor}
.chip.good{color:var(--good)} .chip.warn{color:var(--accent)}
.chip.bad{color:var(--bad)} .chip.dim{color:var(--dim)}

.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;margin-top:10px}
.tabs button{flex:1;padding:9px;border-radius:8px;font-weight:700;font-size:14px;color:var(--dim)}
.tabs button.on{background:var(--high);color:var(--text)}

#roompanel{padding:8px 16px 0}
.row{display:flex;gap:6px}
.input{
  flex:1;width:100%;background:var(--high);border:1px solid var(--border);border-radius:10px;
  padding:11px 12px;font-size:15px;letter-spacing:1px
}
#joinbtn{padding:0 20px;border-radius:var(--radius);background:var(--accent);color:#000;font-weight:700}

#keyview{flex:1;display:flex;flex-direction:column;min-height:0}
#log{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;-webkit-overflow-scrolling:touch}

.msg{padding:12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);max-width:94%;display:flex;flex-direction:column;gap:9px}
.msg.mine{align-self:flex-end;background:var(--accentdim);border-color:var(--accent)}
.msg.theirs{align-self:flex-start}
.msg.theirs.active{border-color:var(--accent)}
.msgtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{padding:5px 12px;border-radius:20px;background:var(--high);border:1px solid var(--border);font-size:13px;font-weight:600}
.pill.cue{background:var(--accent);border-color:var(--accent);color:#000}
.tag{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--dim)}
.tag.good{color:var(--good)} .tag.warn{color:var(--accent)} .tag.bad{color:var(--bad)}
.linkish{text-decoration:underline}

.tiles{display:flex;flex-wrap:wrap;gap:5px}
.tile{
  min-width:34px;padding:5px;border-radius:8px;background:var(--high);
  border:1px solid var(--border);display:flex;flex-direction:column;align-items:center
}
.tile.wordbreak{margin-left:14px}
.tile.active{background:var(--accent);border-color:var(--accent)}
.tile.active .code,.tile.active .char{color:#000}
.tile.solved{border-color:var(--good)}
.tile.given{border-color:var(--dim);border-style:dashed}
.tile.shown .code{color:var(--dim)}
.tile:not(.shown) .code{color:var(--accent)}
.tile[disabled]{cursor:default}
.tile.done{border-color:var(--good)}
.tile.done{background:var(--good)}
.tile.done .char,.tile.done .code{color:#000}
.tile.current{border-color:var(--accent);border-width:2px}
.tile.missed{border-color:var(--bad);border-width:2px}
.tile .code{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--dim)}
.tile .char{font-size:16px;font-weight:700}


.plain{font-size:17px;font-weight:700;letter-spacing:.5px}
.instruction{font-size:13px;font-weight:600}
.instruction.bad{color:var(--bad)} .instruction.dim{color:var(--dim);font-weight:400}
.helper{flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);background:var(--high);font-size:13px;font-weight:700;text-align:center}
.helper.dim{color:var(--dim)}

#decodebanner{
  display:none;align-items:center;justify-content:space-between;margin:0 16px;
  padding:9px 12px;border-radius:10px;border:1px solid var(--accent);background:var(--accentdim);font-size:12px;font-weight:600
}
#stopdecode{color:var(--accent);font-weight:800;font-size:13px}

#guide{flex:none;margin:0 16px;padding:10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:8px;max-height:34vh;overflow-y:auto}
#draft{flex:none;margin:8px 16px 10px;padding:10px;min-height:58px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;justify-content:center}
.draftmorse{color:var(--accent);font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:3px;word-break:break-all}

.key{
  flex:none;margin:0 16px;height:104px;border-radius:22px;background:var(--high);
  border:2px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;
  touch-action:none; -webkit-touch-callout:none
}
.key.dot{border-color:var(--accent)}
.key.dash{background:var(--accent);border-color:var(--accent)}
.key.dash .mark,.key.dash .marklabel{color:#000}
.mark{font-size:44px;font-weight:900;line-height:48px}
.marklabel{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--dim)}
.keyidle{font-size:20px;font-weight:800;letter-spacing:4px;color:var(--dim)}
#keyhint{text-align:center;font-size:11px;color:var(--dim);padding:6px 16px}

#actions{flex:none;display:flex;gap:6px;padding:0 16px 10px}
#actions button{
  flex:1;min-height:46px;border-radius:var(--radius);background:var(--surface);
  border:1px solid var(--border);font-size:14px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center
}
#actions button small{font-size:9px;color:var(--dim);font-weight:400}
#actions #send{flex:1.2;background:var(--accent);border-color:var(--accent);color:#000}
#actions #send:disabled{opacity:.4}
#actions #spacebtn.armed{background:var(--accent);border-color:var(--accent);color:#000}
#actions #spacebtn.armed small{color:#000}

#otherview{flex:1;overflow-y:auto;padding:12px 16px 40px;-webkit-overflow-scrolling:touch}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.card.pad{padding:14px;display:flex;flex-direction:column;gap:12px}
.note{color:var(--dim);font-size:12px;line-height:1.5;margin:0 0 8px}
.note.center{text-align:center;padding-top:10px}
.chartrow{display:flex;align-items:center;width:100%;padding:11px 14px;border-bottom:1px solid var(--border);gap:10px}
.chartrow .char{font-size:17px;font-weight:700;width:24px;text-align:left}
.chartrow .code{flex:1;color:var(--accent);font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:3px;text-align:left}
.chartrow .hint{font-size:12px;color:var(--dim)}
.mode{flex:1;padding:12px;border-radius:10px;background:var(--high);border:1px solid var(--border);font-weight:700;font-size:15px;text-align:center}
.mode.on{background:var(--accent);border-color:var(--accent);color:#000}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:54px;height:52px;border-radius:12px;background:var(--accent);color:#000;font-size:26px;font-weight:800}
.stepval{flex:1;text-align:center;font-size:30px;font-weight:800;display:flex;flex-direction:column}
.stepval small{font-size:11px;color:var(--dim);font-weight:400}
.version{color:var(--dim);font-size:12px;text-align:center;margin-top:20px}
.good{color:var(--good)} .bad{color:var(--bad)}
</style>
</head>
<body>

<header>
  <div class="titlerow">
    <h1>MORSE TAP</h1>
    <button id="chip" class="chip dim">Offline</button>
  </div>
  <div class="tabs">
    <button id="tab-key" class="on">Key</button>
    <button id="tab-chart">Chart</button>
    <button id="tab-settings">Settings</button>
  </div>
</header>

<div id="roompanel" style="display:none">
  <div class="row">
    <input id="roominput" class="input" placeholder="ROOM CODE" maxlength="12" autocapitalize="characters" autocomplete="off">
    <button id="joinbtn">Join</button>
  </div>
</div>

<div id="keyview">
  <div id="log"></div>

  <div id="decodebanner">
    <span>Decoding — the key belongs to that message</span>
    <button id="stopdecode">Stop</button>
  </div>

  <div id="guide"></div>
  <div id="draft"></div>
  <div id="key" class="key"><div class="keyidle">HOLD</div></div>
  <div id="keyhint"></div>

  <div id="actions">
    <button id="undo">Undo<small>hold = letter</small></button>
    <button id="spacebtn">Space<small>end word</small></button>
    <button id="clear">Clear</button>
    <button id="send">Send</button>
  </div>
</div>

<div id="otherview" style="display:none"></div>

<script type="module" src="app.js"></script>
</body>
</html>
